interface:
  display_name: "Story Readiness"
  short_description: "Validate that a story file is implementation-ready. Checks for…"
  default_prompt: "Use $story-readiness to validate that a story file is implementation-ready. Checks for embedded GDD requirements, ADR references, engine notes, clear acceptance criteria, and no open design questions. Produces READY / NEEDS WORK / BLOCKED verdict with specific gaps. Use when user says 'is this story ready', 'can I start on this story', 'is story X ready to implement'."
policy:
  allow_implicit_invocation: true
