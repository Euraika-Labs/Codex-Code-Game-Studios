interface:
  display_name: "Team QA"
  short_description: "Orchestrate the QA team through a full testing cycle. Coordinates…"
  default_prompt: "Use $team-qa to orchestrate the QA team through a full testing cycle. Coordinates qa-lead (strategy + test plan) and qa-tester (test case writing + bug reporting) to produce a complete QA package for a sprint or feature. Covers: test plan generation, test case writing, smoke check gate, manual QA execution, and sign-off report."
policy:
  allow_implicit_invocation: false
