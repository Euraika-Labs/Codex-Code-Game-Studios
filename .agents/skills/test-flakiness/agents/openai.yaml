interface:
  display_name: "Test Flakiness"
  short_description: "Detect non-deterministic (flaky) tests by reading CI run logs or test…"
  default_prompt: "Use $test-flakiness to detect non-deterministic (flaky) tests by reading CI run logs or test result history. Aggregates pass rates per test, identifies intermittent failures, recommends quarantine or fix, and maintains a flaky test registry. Best run during Polish phase or after multiple CI runs."
policy:
  allow_implicit_invocation: true
