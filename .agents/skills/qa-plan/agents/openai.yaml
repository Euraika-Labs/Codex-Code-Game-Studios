interface:
  display_name: "QA Plan"
  short_description: "Generate a QA test plan for a sprint or feature. Reads GDDs and story…"
  default_prompt: "Use $qa-plan to generate a QA test plan for a sprint or feature. Reads GDDs and story files, classifies stories by test type (Logic/Integration/Visual/UI), and produces a structured test plan covering automated tests required, manual test cases, smoke test scope, and playtest sign-off requirements. Run before sprint begins or when starting a major feature."
policy:
  allow_implicit_invocation: false
