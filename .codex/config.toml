# Shared Codex defaults for this studio template.
# Personal overrides belong in ~/.codex/config.toml.

model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
tool_output_token_limit = 20000
web_search = "live"

[agents]
max_threads = 6
max_depth = 1

[features]
apply_patch_freeform = true
codex_hooks = true
